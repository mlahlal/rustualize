[package]
name = "rustualize"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.29.0", features = ["sched", "hostname", "socket", "mount", "fs", "user", "signal"] }
reqwest = { version = "0.12.12", features = ["blocking", "rustls-tls", "json"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11.6"
gumdrop = "0.8.1"
log = "0.4.25"
rand = "0.8.5"
capctl = "0.2.0"
syscallz = "0.17.0"
libc = "0.2.169"
rlimit = "0.10.2"
cgroups-rs = "0.3.4"
flate2 = "1.0.35"
tar = "0.4.43"
tonic = "0.14.0"
prost = "0.14.1"
tonic-prost-build = "0.14.1"
tonic-prost = "0.14.1"
tonic-reflection = "0.14.1"

[[bin]]
name = "rustualize-server"
path = "src/api.rs"

#[[bin]]
#name = "helloworld-client"
#path = "src/client.rs"

[build-dependencies]
tonic-build = "0.14.0"
tonic-prost-build = "0.14.1"
tonic-prost = "0.14.1"
